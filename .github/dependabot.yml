version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem rather than per package — these move together and
      # reviewing them separately is noise.
      types:
        patterns: ["@types/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "next"]
      dev-tooling:
        patterns: ["@biomejs/*", "vitest", "@vitest/*", "tsup", "tsx", "typescript"]
    ignore:
      # Pinned deliberately: the vector index is built for a fixed embedding
      # dimension, and a major FalkorDB bump needs a migration, not a merge.
      - dependency-name: falkordb
        update-types: [version-update:semver-major]
      # These typings describe the runtime we actually support, so they follow
      # the engines floor (>=22) and the CI matrix (22, 24) rather than the
      # newest release. Taking a major ahead of those lets code typecheck
      # against APIs that are absent at runtime. Raise this when the floor
      # rises; minors and patches still come through in the types group.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
