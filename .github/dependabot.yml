version: 2

# Version-update PRs are an endless stream by nature — roughly forty direct
# dependencies means something is newer most weeks, and clearing the queue only
# makes room for the next one. So this file is tuned for how *rarely* and how
# *few*, not for staying on the newest release of everything.
updates:
  - package-ecosystem: npm
    directory: /
    # Monthly, not weekly. Twelve batches a year rather than fifty.
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Exactly one group, matching everything, with no update-types filter.
      # Both halves are deliberate. A previous version of this file had a
      # minor/patch group on the same "*" pattern: it claimed every package,
      # its filter then dropped the majors, and those majors fell through to no
      # group at all instead of on to the next one — which is how zod and
      # dotenv each arrived in a PR of their own. A single unfiltered group
      # has nothing to fall through to.
      #
      # The cost is that a major rides along with the minors, so a red build
      # needs bisecting. That is the right trade at one PR a month; split the
      # offending package back out temporarily if it ever happens.
      all:
        patterns: ["*"]
    ignore:
      # Pinned deliberately: the vector index is built for a fixed embedding
      # dimension, and a major FalkorDB bump needs a migration, not a merge.
      - dependency-name: falkordb
        update-types: [version-update:semver-major]
      # These typings describe the runtime we actually support, so they follow
      # the engines floor (>=22) and the CI matrix (22, 24) rather than the
      # newest release. Taking a major ahead of those lets code typecheck
      # against APIs that are absent at runtime. Raise this when the floor
      # rises; minors and patches still come through in the group above.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Grouped for the same reason as npm. Ungrouped, this ecosystem opened one
    # PR per action — setup-node and upload-artifact arrived separately even
    # though they are always reviewed together.
    groups:
      actions:
        patterns: ["*"]
