name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack without publishing"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: the published package carries a signed,
      # verifiable link back to the commit and workflow that built it.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter cognitive-mirror build

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./apps/cli/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match apps/cli/package.json version $pkg"
            exit 1
          fi

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        run: pnpm --filter cognitive-mirror publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack only (dry run)
        if: inputs.dry_run == true
        run: pnpm --filter cognitive-mirror exec npm pack --pack-destination /tmp
