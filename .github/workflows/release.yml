name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate the package without publishing"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC. This is what authenticates the publish (npm trusted publishing,
      # so there is no NPM_TOKEN) and what lets npm attach provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # npm's own guidance for release builds: never restore a cache into
          # the job that produces the artifact people install.
          package-manager-cache: false

      # The npm bundled with Node is older than trusted publishing requires.
      - name: Install an npm new enough for trusted publishing
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter cognitive-mirror build

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./apps/cli/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match apps/cli/package.json version $pkg"
            exit 1
          fi

      # Publishing is irreversible and a version number cannot be reused, so the
      # two failure modes that produced an unattested 0.1.0 are checked BEFORE
      # anything is uploaded rather than after.
      - name: Pre-flight the provenance prerequisites
        run: |
          npm_version=$(npm --version)
          echo "npm $npm_version"
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) {
              console.log(`::error::npm ${process.argv[1]} is too old for trusted publishing (need >= 11.5.1)`);
              process.exit(1);
            }
          ' "$npm_version"
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::no OIDC token available — the job is missing id-token: write"
            exit 1
          fi
          echo "OIDC token endpoint present"

      # pnpm packs, npm publishes, and each is doing the half the other cannot.
      #
      # Only pnpm rewrites the workspace:* devDependencies into real versions —
      # npm has no idea what that protocol means and would ship it verbatim.
      #
      # Only npm attaches provenance. `pnpm publish --provenance` accepts the
      # flag and silently drops it (pnpm#6607), which is exactly how 0.1.0 went
      # out with dist.attestations null despite the flag being set.
      #
      # So: pack with pnpm, unpack, publish that directory with npm.
      - name: Stage the package
        run: |
          cd apps/cli
          pnpm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/stage"
          tar -xzf "$RUNNER_TEMP"/cognitive-mirror-*.tgz -C "$RUNNER_TEMP/stage"
          version=$(node -p "require('$RUNNER_TEMP/stage/package/package.json').version")
          # A prerelease goes out under `next`, never `latest`. Three reasons,
          # and the third is not optional: npx cognitive-mirror@latest must not
          # hand people a release candidate; it makes this pipeline rehearsable,
          # since tagging v0.1.1-rc.0 proves provenance attaches while spending
          # an rc rather than a real version; and npm outright refuses to
          # publish a prerelease unless --tag is given.
          #
          # Resolved once here so the publish and the dry run cannot disagree.
          case "$version" in
            *-*) dist_tag=next ;;
            *)   dist_tag=latest ;;
          esac
          echo "staged $version -> dist-tag $dist_tag"
          echo "PKG_VERSION=$version" >> "$GITHUB_ENV"
          echo "DIST_TAG=$dist_tag" >> "$GITHUB_ENV"

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        working-directory: ${{ runner.temp }}/stage/package
        run: |
          echo "publishing $PKG_VERSION under dist-tag $DIST_TAG"
          npm publish --access public --provenance --tag "$DIST_TAG"

      # Provenance failing open is what went unnoticed last time: the release was
      # green, the flag was set, and the package shipped unsigned anyway. Assert
      # the outcome instead of trusting the flag.
      - name: Verify the published version carries provenance
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        run: |
          att=""
          for _ in $(seq 1 10); do
            att=$(npm view "cognitive-mirror@$PKG_VERSION" dist.attestations --json 2>/dev/null || true)
            if [ -n "$att" ] && [ "$att" != "null" ]; then break; fi
            sleep 6
          done
          if [ -z "$att" ] || [ "$att" = "null" ]; then
            echo "::error::cognitive-mirror@$PKG_VERSION published WITHOUT provenance; it cannot be re-published, so ship the next version once the cause is fixed"
            exit 1
          fi
          echo "provenance attached: $att"

      - name: Validate the package without publishing
        if: inputs.dry_run == true
        working-directory: ${{ runner.temp }}/stage/package
        run: |
          # --dry-run still asks the registry, so between releases — when the
          # version in the tree is the one already published — it reports a
          # collision and fails. That is the single error this step forgives:
          # reaching it means packing, staging and every other check passed,
          # which is all a dry run can establish.
          set +e
          out=$(npm publish --dry-run --access public --tag "$DIST_TAG" 2>&1)
          status=$?
          set -e
          echo "$out"
          if [ "$status" -ne 0 ]; then
            if echo "$out" | grep -qi "cannot publish over the previously published versions"; then
              echo "::notice::package validates; $PKG_VERSION is already on the registry, which is expected outside a release"
            else
              exit "$status"
            fi
          fi
