# The data plane. Everything binds to 127.0.0.1 only.
# FalkorDB is the single data store (graph + native vector index); Ollama serves
# embeddings.
#
# The project name is pinned rather than inferred from the parent directory,
# because this file is used from two places: a git checkout, and the copy inside
# the installed npm package. Without it Compose derives a different project name
# per location and the second one fails on a container-name conflict — while the
# first one's volumes quietly become unreachable.
name: cognitive-mirror

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: cm-falkordb
    # Durable persistence: AOF logs every write (survives any restart, not just
    # snapshots), and the volume is mounted at FalkorDB's real data dir
    # (/var/lib/falkordb/data) — NOT /data, which the image does not write to, so
    # mounting there silently lost data on `docker compose down`.
    environment:
      - REDIS_ARGS=--appendonly yes --appendfsync everysec
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3001:3000" # FalkorDB Browser UI (optional)
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: cm-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  falkordb-data:
  ollama-data:
