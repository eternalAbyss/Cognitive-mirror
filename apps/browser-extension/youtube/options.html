<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 14px -apple-system, system-ui, sans-serif; padding: 20px; max-width: 420px; }
      label { display: block; margin: 14px 0 4px; font-weight: 600; }
      input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
      button { margin-top: 16px; padding: 9px 16px; border: 0; border-radius: 8px; background: #0c0c0c; color: #fff; cursor: pointer; }
      #saved { margin-left: 12px; color: green; }
    </style>
  </head>
  <body>
    <h3>Cognitive Mirror — YouTube capture</h3>
    <label for="url">Ingestion URL</label>
    <input id="url" placeholder="http://127.0.0.1:4002/ingest" />
    <label for="token">INGEST_TOKEN (optional)</label>
    <input id="token" type="password" placeholder="leave blank for local dev" />
    <div>
      <button type="button" id="save">Save</button><span id="saved"></span>
    </div>
    <script src="options.js"></script>
  </body>
</html>
